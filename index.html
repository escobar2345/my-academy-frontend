<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&family=Noto+Sans+SC:wght@300;400;500;700;800;900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiroFish - 社交媒体舆论模拟系统" />
    <title>MiroFish - 预测万物</title>
    <!-- Paystack inline checkout library — provides window.PaystackPop, used by the
         registration, dashboard, roadmap and classroom payment flows.
         `defer` matters: without it this is a parser-blocking script, so if
         js.paystack.co is slow or unreachable the whole page stays blank (no
         #app, no DOMContentLoaded). Deferred classic scripts still run before
         the `type="module"` bundle below, so PaystackPop is ready by the time
         any component mounts. -->
    <script defer src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
